<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28594a">
  <title>待办</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">待办清单</h1>
    <form id="add-form" autocomplete="off">
      <label class="sr-only" for="title">新的待办事项</label>
      <input id="title" placeholder="添加待办…" maxlength="100" required>
      <button type="submit">添加</button>
    </form>
    <section class="list-panel" aria-label="待办事项">
      <ul id="todos"></ul>
    </section>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
